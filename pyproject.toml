[project]
name = "obv-automations"
version = "0.1.0"
description = "Oblivion Multi-Agent Build Automation — 7 agents that turn a meeting into a wireframe, plan, Gantt and budget."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "supabase>=2.6",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-aws>=0.2",
    "psycopg[binary,pool]>=3.2",
    "python-docx>=1.1",
    "httpx>=0.27",
    "mcp>=1.27",
]

[project.optional-dependencies]
# Local model provider (MODEL_PROVIDER=ollama) — run open-weight models on your
# own machine, no AWS. Install with: pip install -e ".[local]"
local = ["langchain-ollama>=0.2"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
